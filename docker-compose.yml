version: '3.8'

services:
  command-center:
    build: .
    container_name: command-center
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/backend/db.sqlite
      # Use host.docker.internal to allow the container to reach Ollama running on your local machine
      - OLLAMA_HOST=http://host.docker.internal:11434
      # This matches the mount path inside the container
      - OBSIDIAN_VAULT_PATH=/obsidian
      
      # Add your Google OAuth credentials here if testing Google integrations
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=http://localhost:3001/api/google/callback
    volumes:
      # Map the local database file into the container to persist state
      # Make sure you have an empty db.sqlite file in the backend folder on your host machine before starting
      - ./backend/db.sqlite:/app/backend/db.sqlite
      
      # Map your local Obsidian Vault into the container at /obsidian
      # Modify the left side to point to your actual local vault path
      - ./obsidian/Life Organizer:/obsidian
    
    # Required for host.docker.internal to work on some Linux/Docker versions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
